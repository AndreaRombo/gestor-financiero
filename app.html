<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#0A0D14" />
  <title>Gestor Financiero</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0A0D14;
      color: #E8EDF7;
      -webkit-font-smoothing: antialiased;
    }
    #app { width: 100%; height: 100%; }
    .container { max-width: 1400px; margin: 0 auto; padding: 20px 16px; }
    .header { margin-bottom: 32px; }
    .header h1 { font-size: 32px; font-weight: 700; margin-bottom: 8px; }
    .header p { font-size: 13px; color: #8B98B0; max-width: 400px; margin-bottom: 16px; }
    .header-actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .btn {
      padding: 10px 16px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      font-weight: 500;
      font-size: 13px;
      transition: all 120ms ease;
    }
    .btn-primary { background: #A78BFA; color: #160E2E; }
    .btn-primary:hover { background: #C4B5FD; }
    .btn-secondary { background: #121722; border: 1px solid #242C3D; color: #E8EDF7; }
    .btn-secondary:hover { background: #171E2B; }
    .btn-sm { padding: 6px 10px; font-size: 12px; }
    .card {
      border: 1px solid #1C2434;
      background: #121722;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
    }
    .metrics { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 20px; }
    .metric { border: 1px solid #1C2434; background: #171E2B; border-radius: 12px; padding: 16px; }
    .metric-label { font-size: 11px; color: #8B98B0; margin-bottom: 8px; }
    .metric-value { font-size: 18px; font-weight: 700; }
    input, select, textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid #242C3D;
      background: #0A0D14;
      color: #E8EDF7;
      border-radius: 8px;
      font-size: 13px;
      font-family: inherit;
      margin-bottom: 12px;
    }
    input:focus, select:focus { outline: 2px solid #A78BFA; outline-offset: 2px; }
    .upload-zone {
      border: 2px dashed #242C3D;
      border-radius: 12px;
      padding: 40px;
      text-align: center;
      cursor: pointer;
      transition: all 200ms ease;
    }
    .upload-zone.active { border-color: #A78BFA; background: #171E2B; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th { background: #171E2B; padding: 10px; text-align: left; border-bottom: 1px solid #1C2434; }
    td { padding: 10px; border-bottom: 1px solid #1C2434; }
    tr:hover { background: #171E2B; }
    .category { display: inline-block; padding: 4px 8px; border-radius: 4px; font-size: 11px; font-weight: 500; }
    .empty { text-align: center; color: #8B98B0; padding: 40px; }
    .alert {
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 16px;
      font-size: 13px;
      animation: slideIn 300ms ease;
    }
    .alert-error { background: #1C1218; border: 1px solid #5B2733; color: #FFC9D2; }
    .alert-success { background: #1C3A2A; border: 1px solid #34D399; color: #34D399; }
    @keyframes slideIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
    .modal { display: none; position: fixed; inset: 0; background: rgba(5,7,12,0.8); z-index: 100; align-items: center; justify-content: center; }
    .modal.active { display: flex; }
    .modal-content { background: #121722; border: 1px solid #242C3D; border-radius: 12px; padding: 20px; max-width: 500px; width: 90%; }
    .modal-close { float: right; cursor: pointer; color: #8B98B0; font-size: 20px; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .bar { display: flex; height: 8px; border-radius: 4px; overflow: hidden; margin: 8px 0; }
    .bar-item { transition: width 700ms ease; }
    @media (max-width: 600px) {
      .header h1 { font-size: 22px; }
      .grid-2 { grid-template-columns: 1fr; }
      .metrics { grid-template-columns: 1fr; }
      table { font-size: 12px; }
    }
  </style>
</head>
<body>
  <div id="app" class="container">
    <div style="text-align: center; padding: 40px; color: #8B98B0;">
      <p>Cargando app...</p>
    </div>
  </div>

  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script>
    const { useState, useEffect, useMemo, useRef } = React;
    const e = React.createElement;

    const CATEGORIES = {
      suministros: { label: "Suministros", color: "#FBBF24" },
      ingresos: { label: "Nómina / Ingresos", color: "#34D399" },
      ocio: { label: "Restaurantes / Ocio", color: "#FB7185" },
      suscripciones: { label: "Suscripciones", color: "#A78BFA" },
      supermercado: { label: "Supermercado", color: "#38BDF8" },
      transporte: { label: "Transporte", color: "#F97316" },
      varios: { label: "Varios", color: "#94A3B8" }
    };

    const strip = s => String(s || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
    const eur = (v) => new Intl.NumberFormat("es-ES", { style: "currency", currency: "EUR", minimumFractionDigits: 2 }).format(v);

    const parseAmount = v => {
      if (typeof v === "number") return isFinite(v) ? v : NaN;
      let s = String(v || "").trim();
      if (!s) return NaN;
      let neg = false;
      if (/^\(.*\)$/.test(s)) { neg = true; s = s.slice(1, -1); }
      s = s.replace(/eur/gi, "").replace(/[€$£\s]/g, "");
      if (s.startsWith("-")) { neg = true; s = s.slice(1); } else if (s.startsWith("+")) s = s.slice(1);
      if (!/^[\d.,]+$/.test(s)) return NaN;
      const lc = s.lastIndexOf(","), ld = s.lastIndexOf(".");
      if (lc > -1 && ld > -1) s = lc > ld ? s.replace(/\./g, "").replace(",", ".") : s.replace(/,/g, "");
      else if (lc > -1) s = /^\d{1,3}(,\d{3})+$/.test(s) ? s.replace(/,/g, "") : s.replace(",", ".");
      else if (ld > -1 && /^\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g, "");
      const n = parseFloat(s);
      return !isFinite(n) ? NaN : neg ? -n : n;
    };

    const categorize = (concepto, importe) => {
      const s = strip(concepto);
      if (s.match(/nomina|salario|ingreso|transferencia|paga|abono/)) return "ingresos";
      if (s.match(/netflix|spotify|amazon|disney|apple|hbo|dazn/)) return "suscripciones";
      if (s.match(/mercadona|carrefour|lidl|aldi|dia|eroski/)) return "supermercado";
      if (s.match(/restaurante|bar|cafe|glovo|uber eats|cine|tapas|bodega/)) return "ocio";
      if (s.match(/gasolinera|renfe|uber|parking|taxi|repsol|cepsa/)) return "transporte";
      if (s.match(/luz|agua|gas|movistar|vodafone|orange|telefonica/)) return "suministros";
      return "varios";
    };

    let uid = 0;
    const STORE = "fin:data";

    function App() {
      const [rows, setRows] = useState([]);
      const [fileName, setFileName] = useState("");
      const [error, setError] = useState("");
      const [notice, setNotice] = useState("");
      const [ready, setReady] = useState(false);
      const [query, setQuery] = useState("");
      const [formOpen, setFormOpen] = useState(false);
      const [saveState, setSaveState] = useState("idle");
      const inputRef = useRef(null);

      useEffect(() => {
        const saved = localStorage.getItem(STORE);
        if (saved) {
          try {
            const data = JSON.parse(saved);
            setRows(data.rows.map(r => ({ ...r, fecha: r.fecha ? new Date(r.fecha) : null })));
            setFileName(data.fileName);
            setSaveState("saved");
          } catch {}
        }
        setReady(true);
      }, []);

      useEffect(() => {
        if (!ready || !rows.length) return;
        const timer = setTimeout(() => {
          localStorage.setItem(STORE, JSON.stringify({ 
            fileName, 
            rows: rows.map(r => ({ ...r, fecha: r.fecha?.toISOString() }))
          }));
          setSaveState("saved");
        }, 500);
        setSaveState("saving");
        return () => clearTimeout(timer);
      }, [rows, fileName, ready]);

      const handleFile = file => {
        if (!file) return;
        const reader = new FileReader();
        reader.onload = e => {
          try {
            const lines = e.target.result.split("\n").filter(l => l.trim());
            if (lines.length < 2) throw new Error("Archivo vacío");
            const header = lines[0].split(",").map(h => h.toLowerCase().trim());
            const dateIdx = header.findIndex(h => h.match(/fecha|date/));
            const conceptIdx = header.findIndex(h => h.match(/concepto|descripcion/));
            const amountIdx = header.findIndex(h => h.match(/importe|amount/));
            if (conceptIdx === -1 || amountIdx === -1) throw new Error("Columnas no encontradas");

            const newRows = [];
            for (let i = 1; i < lines.length; i++) {
              const parts = lines[i].split(",");
              const concepto = parts[conceptIdx]?.trim();
              const importe = parseAmount(parts[amountIdx]);
              if (concepto && !isNaN(importe)) {
                newRows.push({
                  id: `r${uid++}`,
                  fecha: dateIdx >= 0 ? new Date(parts[dateIdx]) : new Date(),
                  concepto,
                  importe,
                  categoria: categorize(concepto, importe)
                });
              }
            }
            setRows(prev => [...prev, ...newRows]);
            setFileName(file.name);
            setError("");
            setNotice(`✓ Se añadieron ${newRows.length} movimientos`);
            setTimeout(() => setNotice(""), 3000);
          } catch (err) {
            setError(err.message);
          }
        };
        reader.readAsText(file);
      };

      const totals = useMemo(() => {
        let ingresos = 0, gastos = 0;
        rows.forEach(r => { if (r.importe >= 0) ingresos += r.importe; else gastos += -r.importe; });
        return { ingresos, gastos, balance: ingresos - gastos };
      }, [rows]);

      const breakdown = useMemo(() => {
        const map = new Map();
        rows.forEach(r => { if (r.importe < 0) map.set(r.categoria, (map.get(r.categoria) || 0) + -r.importe); });
        const arr = [...map.entries()].map(([id, total]) => ({ ...CATEGORIES[id], id, total })).sort((a, b) => b.total - a.total);
        const sum = arr.reduce((s, c) => s + c.total, 0) || 1;
        return arr.map(c => ({ ...c, pct: (c.total / sum) * 100 }));
      }, [rows]);

      const filtered = useMemo(() => {
        const q = strip(query);
        return rows.filter(r => strip(r.concepto).includes(q)).reverse();
      }, [rows, query]);

      const hasData = rows.length > 0;

      return e("div", null,
        e("div", { className: "header" },
          e("h1", null, "💰 Dónde va el dinero"),
          e("p", null, "Analiza tu extracto bancario y visualiza tus gastos"),
          hasData && e("div", { className: "header-actions" },
            e("button", { className: "btn btn-secondary", onClick: () => inputRef.current?.click() }, "+ Añadir archivo"),
            e("button", { className: "btn btn-primary", onClick: () => setFormOpen(true) }, "+ Nuevo"),
            e("button", { className: "btn btn-secondary", onClick: () => { if (confirm("¿Borrar todo?")) { setRows([]); localStorage.removeItem(STORE); } } }, "Borrar todo")
          )
        ),

        error && e("div", { className: "alert alert-error" }, error),
        notice && e("div", { className: "alert alert-success" }, notice),

        !ready ? e("div", { className: "empty" }, "Cargando...") :
        !hasData ? e("div", { className: "card" },
          e("div", { className: "upload-zone", onDragOver: e => e.preventDefault(), onDrop: e => { e.preventDefault(); handleFile(e.dataTransfer.files[0]); } },
            e("p", { style: { marginBottom: 8 } }, "📁 Arrastra tu extracto aquí"),
            e("p", { style: { fontSize: 12, color: "#8B98B0" } }, "o pulsa para seleccionar CSV/Excel"),
            e("div", { style: { marginTop: 16, display: "flex", gap: 8, justifyContent: "center" } },
              e("button", { className: "btn btn-primary", onClick: () => inputRef.current?.click() }, "Seleccionar archivo"),
              e("button", { className: "btn btn-secondary", onClick: () => { setRows([{ id: `r${uid++}`, fecha: new Date(), concepto: "NOMINA", importe: 2500, categoria: "ingresos" }]); setFileName("Ejemplo"); } }, "Ejemplo")
            ),
            e("input", { ref: inputRef, type: "file", accept: ".csv,.txt,.xls,.xlsx", onChange: e => handleFile(e.target.files[0]), style: { display: "none" } })
          )
        ) : e(React.Fragment, null,
          e("input", { type: "file", ref: inputRef, accept: ".csv,.txt,.xls,.xlsx", onChange: e => handleFile(e.target.files[0]), style: { display: "none" } }),

          e("div", { className: "metrics" },
            e("div", { className: "metric" },
              e("div", { className: "metric-label" }, "Ingresos"),
              e("div", { className: "metric-value", style: { color: "#34D399" } }, eur(totals.ingresos))
            ),
            e("div", { className: "metric" },
              e("div", { className: "metric-label" }, "Gastos"),
              e("div", { className: "metric-value", style: { color: "#FB7185" } }, eur(totals.gastos))
            ),
            e("div", { className: "metric" },
              e("div", { className: "metric-label" }, "Balance"),
              e("div", { className: "metric-value", style: { color: totals.balance >= 0 ? "#34D399" : "#FB7185" } }, eur(totals.balance))
            )
          ),

          breakdown.length > 0 && e("div", { className: "card" },
            e("h2", { style: { fontSize: 16, marginBottom: 16 } }, "Gasto por categoría"),
            breakdown.map(c => e("div", { key: c.id, style: { marginBottom: 12 } },
              e("div", { style: { display: "flex", justifyContent: "space-between", marginBottom: 4, fontSize: 13 } },
                e("span", null, c.label),
                e("span", { style: { fontWeight: 500 } }, eur(c.total))
              ),
              e("div", { className: "bar" },
                e("div", { className: "bar-item", style: { width: `${c.pct}%`, background: c.color } })
              )
            ))
          ),

          e("div", { className: "card" },
            e("h2", { style: { fontSize: 16, marginBottom: 16 } }, "Movimientos"),
            e("input", { type: "text", placeholder: "Buscar...", value: query, onChange: e => setQuery(e.target.value) }),
            filtered.length === 0 ? e("div", { className: "empty" }, "Sin movimientos") :
            e("table", null,
              e("thead", null, e("tr", null,
                e("th", null, "Fecha"),
                e("th", null, "Concepto"),
                e("th", null, "Categoría"),
                e("th", { style: { textAlign: "right" } }, "Importe"),
                e("th", { style: { textAlign: "right" } }, "")
              )),
              e("tbody", null, filtered.map(r => e("tr", { key: r.id },
                e("td", null, r.fecha?.toLocaleDateString("es-ES") || "-"),
                e("td", null, r.concepto),
                e("td", null, e("span", { className: "category", style: { background: CATEGORIES[r.categoria].color + "20", color: CATEGORIES[r.categoria].color } }, CATEGORIES[r.categoria].label)),
                e("td", { style: { textAlign: "right", fontWeight: 500, color: r.importe >= 0 ? "#34D399" : "#FB7185" } }, (r.importe >= 0 ? "+" : "-") + eur(Math.abs(r.importe))),
                e("td", { style: { textAlign: "right" } }, e("button", { className: "btn btn-sm btn-secondary", onClick: () => setRows(rows.filter(x => x.id !== r.id)) }, "✕"))
              )))
            )
          )
        ),

        formOpen && e("div", { className: "modal active" },
          e("div", { className: "modal-content" },
            e("span", { className: "modal-close", onClick: () => setFormOpen(false) }, "×"),
            e("h2", { style: { fontSize: 16, marginBottom: 16 } }, "Nuevo movimiento"),
            e("input", { type: "text", placeholder: "Concepto", id: "fc" }),
            e("input", { type: "number", placeholder: "Importe", step: 0.01, id: "fi" }),
            e("input", { type: "date", id: "fd" }),
            e("select", { id: "fcat" },
              Object.entries(CATEGORIES).map(([k, v]) => e("option", { key: k, value: k }, v.label))
            ),
            e("button", { className: "btn btn-primary", onClick: () => {
              const c = document.getElementById("fc").value;
              const i = parseAmount(document.getElementById("fi").value);
              const d = new Date(document.getElementById("fd").value);
              const cat = document.getElementById("fcat").value;
              if (!c || isNaN(i)) { setError("Rellena los campos"); return; }
              setRows([...rows, { id: `r${uid++}`, fecha: d, concepto: c, importe: i, categoria: cat }]);
              setFormOpen(false);
            } }, "Añadir"),
            e("button", { className: "btn btn-secondary", onClick: () => setFormOpen(false) }, "Cancelar")
          )
        )
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("app"));
    root.render(e(App));
  </script>
</body>
</html>
